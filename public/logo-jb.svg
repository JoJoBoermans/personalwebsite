<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Joshua Boermans mark">
  <defs>
    <linearGradient id="g" x1="256" y1="160" x2="768" y2="864" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.231  0 0 0 0 0.51  0 0 0 0 0.965  0 0 0 0.35 0" result="c"/>
      <feMerge>
        <feMergeNode in="c"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="512" cy="512" r="332" stroke="url(#g)" stroke-width="32" opacity="0.95" filter="url(#glow)"/>

  <!-- Inner shield / monogram container -->
  <path d="M512 234C612 234 707 272 776 338V544C776 688 675 807 512 860C349 807 248 688 248 544V338C317 272 412 234 512 234Z" fill="#0B1120" stroke="rgba(255,255,255,0.10)" stroke-width="10"/>

  <!-- Monogram: J + B as interlocking paths (clean, stable, infrastructure feel) -->
  <!-- J -->
  <path d="M424 360H576V610C576 704 521 760 436 760C383 760 340 743 304 712L352 644C377 664 403 676 430 676C465 676 484 651 484 610V450H424V360Z" fill="#F8FAFC"/>

  <!-- B -->
  <path d="M612 360H700C778 360 824 403 824 468C824 513 799 545 760 561C810 577 844 612 844 671C844 750 782 800 690 800H612V360Z" fill="#F8FAFC" opacity="0.0"/>
  <!-- B built from strokes for premium feel -->
  <path d="M608 360H680C752 360 792 398 792 456C792 505 760 536 708 544C768 552 808 588 808 648C808 720 756 760 680 760H608V360Z" fill="#F8FAFC"/>
  <path d="M694 448H608V424H682C712 424 730 438 730 460C730 482 714 448 694 448Z" fill="#0B1120" opacity="0.85"/>
  <path d="M704 664H608V640H690C724 640 746 656 746 684C746 712 724 664 704 664Z" fill="#0B1120" opacity="0.85"/>

  <!-- Accent node marks (signals reliability, systems) -->
  <circle cx="512" cy="190" r="10" fill="#3B82F6"/>
  <circle cx="835" cy="512" r="10" fill="#8B5CF6"/>
  <circle cx="512" cy="834" r="10" fill="#3B82F6"/>
  <circle cx="189" cy="512" r="10" fill="#8B5CF6"/>
</svg>
